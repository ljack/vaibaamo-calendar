name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://kpvehddfjxpiztiiinff.supabase.co
      VITE_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwdmVoZGRmanhwaXp0aWlpbmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3NzU3MjAsImV4cCI6MjA4MjEzNTcyMH0.cl6Z0mtF1kMaSObfyFaat5W_GTjhtzgOyNCQ4YzsghM
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        # CI runs locally only.
        CI: true
    - name: Run Vitest tests
      run: npm run test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
