name: Playwright Tests
on:
  deployment_status:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    # Only run on successful deployments or push/PR events
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test tests/e2e.spec.ts
      env:
        # If triggered by deployment_status, use that URL. Otherwise default to localhost or specific dev URL?
        # For Push/PR, we might not have a running app unless we start one.
        # But this setup is specifically for Vercel Previews/Prod.
        # For now, let's prioritize the deployment URL.
        TEST_URL: ${{ github.event.deployment_status.target_url }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
